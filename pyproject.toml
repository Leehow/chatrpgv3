[project]
name = "chatrpgv3"
version = "0.1.0"
description = "Source-grounded TRPG runtime: Postgres-only, semantic-matching-only, CLI-first."
readme = "README.md"
requires-python = ">=3.14.6,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "Leehow" }]
dependencies = [
  "alembic>=1.18.5,<2.0.0",
  "asyncpg>=0.31.0,<0.32.0",
  "httpx>=0.28.1,<0.29.0",
  "openai>=2.9.0,<3.0.0",
  "orjson>=3.11.9,<4.0.0",
  "pgvector>=0.4.2,<0.5.0",
  "psycopg[pool]>=3.3.4,<4.0.0",
  "pydantic>=2.13.4,<3.0.0",
  "pydantic-settings>=2.14.2,<3.0.0",
  "PyYAML>=6.0.3,<7.0.0",
  "rich>=15.0.0,<16.0.0",
  "SQLAlchemy[asyncio]>=2.0.51,<3.0.0",
  "tenacity>=9.1.4,<10.0.0",
  "typer>=0.26.8,<0.27.0",
]

[project.optional-dependencies]
ingest = [
  "pymupdf>=1.28.0,<2.0.0",
  "pdfplumber>=0.11.10,<0.12.0",
  "Pillow>=12.3.0,<13.0.0",
]
observability = [
  "opentelemetry-api>=1.43.0,<2.0.0",
  "opentelemetry-sdk>=1.43.0,<2.0.0",
]

[dependency-groups]
dev = [
  "hypothesis>=6.155.7,<7.0.0",
  "mypy>=2.1.0,<3.0.0",
  "pytest>=9.1.1,<10.0.0",
  "pytest-cov>=7.1.0,<8.0.0",
  "ruff>=0.15.20,<0.16.0",
]

[project.scripts]
trpg = "chatrpg.cli.main:app"

[build-system]
requires = ["hatchling>=1.28.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatrpg"]

[tool.hatch.build.targets.sdist]
include = ["src/chatrpg", "README.md", "pyproject.toml"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
ignore_errors = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["fitz", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.chatrpg.quality]
forbid_hardcoded_text_matching = true
semantic_matching_gateway = "chatrpg.retrieval.semantic"
